<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1b2d">
<title>جنود المسيح S.O.C</title>
<link rel="icon" href="logo-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
:root{
  --navy:#14213d;--navy2:#1f3266;--gold:#e9b949;--gold2:#c9942a;--bg:#f4f1ea;--card:#fff;
  --ink:#1d2433;--muted:#6b7385;--line:#e6e1d6;--red:#c0392b;--green:#1e8e5a;
  --r:18px;--sh:0 6px 20px rgba(20,33,61,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,system-ui,sans-serif;font-size:15px}
body{min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
body.noNav{padding-bottom:0}
a{color:var(--navy2)}
button,input,select,textarea{font-family:inherit;font-size:15px}
.i3d{width:28px;height:28px;object-fit:contain;vertical-align:middle;filter:drop-shadow(0 3px 4px rgba(0,0,0,.18))}
.i3d.lg{width:54px;height:54px}.i3d.xl{width:84px;height:84px}.i3d.sm{width:20px;height:20px}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 4px 14px rgba(0,0,0,.15)}
.top h1{font-size:18px;margin:0;flex:1;font-weight:800}
.top .back{background:rgba(255,255,255,.12);border:0;color:#fff;width:38px;height:38px;border-radius:12px;font-size:20px;cursor:pointer}
.brand{display:flex;align-items:center;gap:8px}
.brand small{color:var(--gold);font-weight:800;letter-spacing:1px}
.wrap{max-width:760px;margin:0 auto;padding:14px}
/* cards */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:14px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:16px}
.muted{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;align-items:center}
.row.wrap2{flex-wrap:wrap}
.grow{flex:1;min-width:0}
/* tiles */
.hero{background:linear-gradient(135deg,var(--navy),#2a4486);color:#fff;border-radius:22px;padding:16px;display:flex;gap:14px;align-items:center;margin-bottom:14px;box-shadow:var(--sh);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;left:-40px;top:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(233,185,73,.28),transparent 70%)}
.hero h2{margin:0;font-size:18px}
.hero .muted{color:#cdd6ee}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:linear-gradient(160deg,#fff,#f7f3ea);border-radius:20px;padding:14px 6px 12px;text-align:center;box-shadow:0 8px 18px rgba(20,33,61,.09),inset 0 -3px 0 rgba(0,0,0,.04);cursor:pointer;border:1px solid #efe9dc;transition:transform .15s;position:relative}
.tile:active{transform:scale(.96)}
.tile b{display:block;margin-top:6px;font-size:13.5px}
.tile .badge{position:absolute;top:8px;left:8px}
.badge:empty{display:none}
.badge{background:var(--red);color:#fff;border-radius:20px;font-size:11px;padding:1px 7px;font-weight:700}
/* forms */
label{display:block;font-weight:700;font-size:13px;margin:10px 0 4px}
input,select,textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;outline:none;color:var(--ink)}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
textarea{min-height:90px;resize:vertical;line-height:1.7}
.btn{border:0;border-radius:14px;padding:11px 16px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#2b1d00;box-shadow:0 4px 10px rgba(201,148,42,.3);display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.block{width:100%;margin-top:14px;padding:13px}
.btn.navy{background:linear-gradient(135deg,var(--navy2),var(--navy));color:#fff;box-shadow:0 4px 10px rgba(20,33,61,.25)}
.btn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--line);box-shadow:none}
.btn.red{background:#fdecea;color:var(--red);box-shadow:none}
.btn.green{background:#e3f5ec;color:var(--green);box-shadow:none}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:11px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:30px;padding:6px 11px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.chip .x{color:var(--red);font-weight:800;margin-inline-start:2px}
/* avatar */
.av{width:52px;height:52px;border-radius:50%;object-fit:cover;background:#e9e4d8;flex:none;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.12);display:inline-flex;align-items:center;justify-content:center}
.av.big{width:110px;height:110px}
.av.s{width:40px;height:40px}
/* list */
.item{display:flex;gap:10px;align-items:center;padding:11px;border-radius:14px;background:#fff;box-shadow:var(--sh);margin-bottom:9px;cursor:pointer}
.item .t{font-weight:700}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
.tag{display:inline-block;background:#f3ecd9;color:#7a5a12;border-radius:8px;padding:2px 8px;font-size:12px;margin:2px;font-weight:600}
/* nav */
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(0,0,0,.07);z-index:30}
.nav a{flex:1;text-align:center;text-decoration:none;color:var(--muted);font-size:11.5px;font-weight:700;position:relative;padding-top:2px}
.nav a.on{color:var(--navy)}
.nav a .i3d{width:30px;height:30px;display:block;margin:0 auto 1px;transition:transform .15s}
.nav a.on .i3d{transform:translateY(-3px) scale(1.12)}
.nav a .badge{position:absolute;top:0;right:calc(50% - 26px)}
/* footer */
.dev{text-align:center;padding:18px 10px 8px;color:var(--muted);font-size:13px}
.dev a{color:var(--gold2);font-weight:800;text-decoration:none;cursor:pointer}
/* modal */
.ov{position:fixed;inset:0;background:rgba(10,15,30,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));animation:up .2s}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sheet h2{margin:0 0 6px;font-size:18px;display:flex;gap:8px;align-items:center}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:14px;z-index:99;font-weight:700;box-shadow:var(--sh);max-width:90%;text-align:center}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .h{font-size:11.5px;color:var(--muted);font-weight:700;padding:4px 0}
.cal .d{aspect-ratio:1;border-radius:12px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-weight:700;position:relative;font-size:14px}
.cal .d.o{opacity:0;pointer-events:none}
.cal .d.today{outline:2px solid var(--gold)}
.cal .d.sel{background:var(--navy);color:#fff}
.cal .d .dots{display:flex;gap:2px;margin-top:2px;height:6px}
.cal .d .dot{width:6px;height:6px;border-radius:50%;background:var(--gold2)}
.cal .d .dot.k{background:#6b8de3}
/* bible */
.verses{font-family:Amiri,serif;font-size:21px;line-height:2.1}
.verse{cursor:pointer;border-radius:6px;padding:0 2px}
.verse sup{color:var(--gold2);font-family:Cairo;font-size:11px;font-weight:800;margin-inline-end:3px}
.verse.sel{background:#fff1c8}
.golden{background:linear-gradient(135deg,#fff8e1,#fdeebf);border-radius:14px;padding:12px;font-family:Amiri,serif;font-size:18px;line-height:1.9;border-inline-start:4px solid var(--gold)}
/* chat */
.msgs{display:flex;flex-direction:column;gap:6px;padding-bottom:80px}
.m{max-width:80%;padding:9px 12px;border-radius:16px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.05);white-space:pre-wrap;word-wrap:break-word;line-height:1.6}
.m.me{align-self:flex-start;background:var(--navy);color:#fff;border-bottom-right-radius:4px}
.m.them{align-self:flex-end;border-bottom-left-radius:4px}
.m .tm{font-size:10.5px;opacity:.6;margin-top:3px}
.m.inv{background:linear-gradient(135deg,#fff8e1,#fff);color:var(--ink);border:1.5px solid var(--gold);min-width:240px;white-space:normal}
.composer{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:flex;gap:8px;box-shadow:0 -4px 14px rgba(0,0,0,.07);z-index:31}
.composer input{flex:1}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.gal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;cursor:pointer;background:#eee}
.file{display:flex;align-items:center;gap:8px;padding:9px;border:1.5px dashed var(--line);border-radius:12px;margin-top:6px;background:#fff;cursor:pointer}
.file .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;font-size:13.5px}
.cover{width:62px;height:84px;border-radius:8px;object-fit:cover;background:linear-gradient(135deg,var(--navy2),var(--navy));flex:none;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(0,0,0,.15)}
.tabs{display:flex;background:#fff;border-radius:14px;padding:4px;margin-bottom:12px;box-shadow:var(--sh)}
.tabs button{flex:1;border:0;background:none;padding:9px;border-radius:11px;font-weight:700;color:var(--muted);cursor:pointer}
.tabs button.on{background:var(--navy);color:#fff}
.demo{background:#fff3cd;color:#7a5a12;font-size:12px;text-align:center;padding:5px;font-weight:700}
.auth{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:20px;background:radial-gradient(circle at 80% 0%,#2a4486,var(--navy) 60%)}
.auth .card{max-width:420px;margin:0 auto;width:100%}
.auth .logo{text-align:center;color:#fff;margin-bottom:16px}
.auth .logo h1{margin:6px 0 0;font-size:26px}
.logoBox{background:#fff;border-radius:28px;padding:12px;width:230px;max-width:70vw;margin:0 auto 12px;box-shadow:0 10px 30px rgba(0,0,0,.35)}.logoBox img{width:100%;display:block}
.hlogo{width:36px;height:36px;background:#fff;border-radius:50%;padding:3px;object-fit:contain;vertical-align:middle;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.auth .logo small{color:var(--gold);font-weight:800;letter-spacing:3px}
.auth .dev{color:#b8c3e0}
.streak{display:flex;gap:10px;align-items:center}
.streak b{font-size:28px;color:var(--gold2)}
.spin{display:inline-block;width:18px;height:18px;border:3px solid rgba(0,0,0,.15);border-top-color:var(--gold2);border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app"><div class="empty" style="padding-top:40vh"><span class="spin"></span></div></div>
<div id="nav"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
"use strict";
const CFG = window.SOC_CONFIG || {};
const DEMO = !CFG.firebase || !window.firebase;
const DEV_SITE = CFG.developerSite || "https://rafatsaeed.com";

/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const h = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const I = (n, c = "") => `<img class="i3d ${c}" src="icons/${n}.png" alt="">`;
const uidGen = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const norm = s => String(s || "").toLowerCase().replace(/[ً-ْـ]/g, "").replace(/[أإآ]/g, "ا").replace(/ة/g, "ه").replace(/ى/g, "ي").replace(/\s+/g, " ").trim();
const digits = s => String(s || "").replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/\D/g, "");
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const MONTHS = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
const DAYS = ["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
function fmtDate(s){ if(!s) return ""; const d = new Date(s + "T00:00"); return `${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`; }
function fmtTime(t){ if(!t) return ""; let [H,M] = t.split(":").map(Number); const p = H < 12 ? "ص" : "م"; H = H % 12 || 12; return `${H}:${pad(M)} ${p}`; }
function ago(ts){ const d = new Date(ts), n = new Date(); if (ymd(d) === ymd(n)) return `${d.getHours() % 12 || 12}:${pad(d.getMinutes())} ${d.getHours() < 12 ? "ص" : "م"}`; return `${d.getDate()} ${MONTHS[d.getMonth()]}`; }
function toast(m){ const t = document.createElement("div"); t.className = "toast"; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }
function modal(html){ closeModal(); const o = document.createElement("div"); o.className = "ov"; o.id = "ov"; o.innerHTML = `<div class="sheet">${html}</div>`; o.onclick = e => { if (e.target === o) closeModal(); }; document.body.appendChild(o); hydrate(o); return o; }
function closeModal(){ const o = $("#ov"); if (!o) return; const wasAnn = !!o.querySelector("#annPop"), pop = o.dataset.pop, ids = o.dataset.ids; o.remove(); if (wasAnn){ annPopupOpen = false; markAnnsSeen(); } if (pop === "cm" && ids) markCMSeen(ids.split(",")); if (wasAnn || pop) setTimeout(() => { if (typeof checkPopups === "function") checkPopups(); }, 500); }
function openExt(url){
  try { const Br = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Browser; if (Br && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) { Br.open({ url }); return; } } catch (e) {}
  const a = document.createElement("a"); a.href = url; a.target = "_blank"; a.rel = "noopener"; document.body.appendChild(a); a.click(); a.remove();
}
const footer = () => `<div class="dev">تواصل مع مطور البرنامج<br><a href="${DEV_SITE}" target="_blank" rel="noopener" onclick="if(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform()){openExt(this.href);return false}">${h(DEV_SITE.replace(/^https?:\/\//, ""))}</a></div>`;
function busy(btn, on){ if (!btn) return; if (on){ btn.dataset.t = btn.innerHTML; btn.innerHTML = '<span class="spin"></span>'; btn.disabled = true; } else { btn.innerHTML = btn.dataset.t || btn.innerHTML; btn.disabled = false; } }
function confirmBox(msg){
  return new Promise(res => {
    const o = document.createElement("div"); o.className = "ov"; o.style.alignItems = "center"; o.style.zIndex = 60;
    o.innerHTML = `<div class="sheet" style="border-radius:22px;max-width:360px;margin:16px;text-align:center"><p style="font-weight:700;font-size:16px;margin:8px 0 16px">${h(msg)}</p><div class="row"><button class="btn navy grow" data-y>نعم</button><button class="btn ghost grow" data-n>لا</button></div></div>`;
    const done = v => { o.remove(); res(v); };
    o.querySelector("[data-y]").onclick = () => done(true); o.querySelector("[data-n]").onclick = () => done(false); o.onclick = e => { if (e.target === o) done(false); };
    document.body.appendChild(o);
  });
}

const TALENTS = [
  { k: "word",   n: "خادم كلمة",          i: "speaking_head",    s: "خادم كلمه واعظ" },
  { k: "praise", n: "خادم تسبيح (مرنم)",  i: "microphone",       s: "خادم تسبيح مرنم مرنمه ترنيم" },
  { k: "oud",    n: "عازف عود",            i: "banjo",            s: "عازف عود" },
  { k: "piano",  n: "عازف بيانو",          i: "musical_keyboard", s: "عازف بيانو اورج كيبورد" },
  { k: "drums",  n: "عازف درامز",          i: "drum",             s: "عازف درامز درمز طبله" },
  { k: "mizmar", n: "عازف مزمار",          i: "flute",            s: "عازف مزمار ناي فلوت" }
];
const tName = k => (TALENTS.find(t => t.k === k) || {}).n || k;
const tIcon = k => (TALENTS.find(t => t.k === k) || {}).i || "musical_notes";
const BOOK_CATS = ["روحي","لاهوتي","تفسير","خدمة وقيادة","تربية وأسرة","تسبيح وموسيقى","قصص وسير","أخرى"];

/* ================= demo file store (IndexedDB) ================= */
const IDB = {
  db: null,
  open(){ return this.db ? Promise.resolve(this.db) : new Promise((res, rej) => { const r = indexedDB.open("soc_files", 1); r.onupgradeneeded = () => r.result.createObjectStore("f"); r.onsuccess = () => { this.db = r.result; res(this.db); }; r.onerror = () => rej(r.error); }); },
  async put(blob){ const db = await this.open(), k = uidGen(); await new Promise((res, rej) => { const t = db.transaction("f", "readwrite"); t.objectStore("f").put(blob, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); return "idb:" + k; },
  async get(u){ const db = await this.open(); return new Promise(res => { const r = db.transaction("f").objectStore("f").get(u.slice(4)); r.onsuccess = () => res(r.result); r.onerror = () => res(null); }); }
};
const urlCache = {};
async function resolveUrl(u){ if (!u) return ""; if (!u.startsWith("idb:")) return u; if (urlCache[u]) return urlCache[u]; const b = await IDB.get(u); return b ? (urlCache[u] = URL.createObjectURL(b)) : ""; }
function hydrate(root = document){ root.querySelectorAll("img[data-f]").forEach(async im => { const u = im.dataset.f; im.removeAttribute("data-f"); im.src = await resolveUrl(u); }); }
async function openFile(u, isImg){
  const r = await resolveUrl(u); if (!r) return toast("الملف مش موجود");
  if (isImg){ const o = modal(`<img src="${h(r)}" style="width:100%;border-radius:14px"><div class="row" style="margin-top:10px"><button class="btn ghost grow" onclick="closeModal()">إغلاق</button>${u.startsWith("idb:") ? "" : `<button class="btn navy grow" onclick="openExt('${h(r)}')">فتح / تحميل</button>`}</div>`); return; }
  openExt(r);
}

/* image compress */
function compressImage(file, max = 1280, q = .82){
  return new Promise(res => {
    if (!file.type.startsWith("image/") || file.type === "image/gif") return res(file);
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { let { width: w, height: hh } = img; const s = Math.min(1, max / Math.max(w, hh)); const c = document.createElement("canvas"); c.width = Math.round(w * s); c.height = Math.round(hh * s); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); c.toBlob(b => { URL.revokeObjectURL(url); res(b ? new File([b], file.name.replace(/\.\w+$/, "") + ".jpg", { type: "image/jpeg" }) : file); }, "image/jpeg", q); };
    img.onerror = () => res(file); img.src = url;
  });
}

/* ================= backend ================= */
const B = DEMO ? makeDemo() : makeFirebase();

function makeDemo(){
  const K = "soc_db_v1", A = "soc_auth_v1", S = "soc_sess_v1";
  const load = () => { try { return JSON.parse(localStorage.getItem(K)) || {}; } catch (e) { return {}; } };
  let data = load();
  const save = () => { try { localStorage.setItem(K, JSON.stringify(data)); } catch (e) { toast("مساحة التخزين التجريبية امتلأت"); } };
  const watchers = [];
  const fire = col => watchers.filter(w => w.col === col).forEach(w => w.run());
  window.addEventListener("storage", e => { if (e.key === K){ data = load(); watchers.forEach(w => w.run()); } });
  const coll = c => (data[c] = data[c] || {});
  const match = (d, f, op, v) => op === "array-contains" ? (d[f] || []).includes(v) : d[f] === v;
  const authDb = () => { try { return JSON.parse(localStorage.getItem(A)) || {}; } catch (e) { return {}; } };
  let cb = null;
  const api = {
    uid: null, phone: null,
    auth: {
      onChange(f){ cb = f; const s = localStorage.getItem(S); if (s){ const a = JSON.parse(s); api.uid = a.uid; api.phone = a.phone; } setTimeout(() => f(api.uid), 0); },
      async signUp(phone, pass){ const db = authDb(); if (db[phone]) throw { code: "auth/email-already-in-use" }; const uid = uidGen(); db[phone] = { pass, uid }; localStorage.setItem(A, JSON.stringify(db)); return api.auth._in(uid, phone); },
      async signIn(phone, pass){ const a = authDb()[phone]; if (!a) throw { code: "auth/user-not-found" }; if (a.pass !== pass) throw { code: "auth/wrong-password" }; return api.auth._in(a.uid, phone); },
      _in(uid, phone){ api.uid = uid; api.phone = phone; localStorage.setItem(S, JSON.stringify({ uid, phone })); cb && cb(uid); return uid; },
      async signOut(){ api.uid = null; localStorage.removeItem(S); cb && cb(null); },
      async deleteMe(pass){ const db = authDb(); const k = Object.keys(db).find(x => db[x].uid === api.uid); if (k && db[k].pass !== pass) throw { code: "auth/wrong-password" }; if (k) delete db[k]; localStorage.setItem(A, JSON.stringify(db)); }
    },
    async get(c, id){ const d = coll(c)[id]; return d ? { id, ...d } : null; },
    async set(c, id, obj){ const cur = coll(c)[id] || {}; const nx = { ...cur }; for (const k in obj){ const v = obj[k]; nx[k] = (v && typeof v === "object" && !Array.isArray(v) && cur[k] && typeof cur[k] === "object" && !Array.isArray(cur[k])) ? { ...cur[k], ...v } : v; } coll(c)[id] = nx; save(); fire(c); },
    async add(c, obj){ const id = uidGen(); coll(c)[id] = obj; save(); fire(c); return id; },
    async del(c, id){ delete coll(c)[id]; save(); fire(c); },
    async where(c, f, op, v){ return Object.entries(coll(c)).filter(([, d]) => match(d, f, op, v)).map(([id, d]) => ({ id, ...d })); },
    async all(c){ return Object.entries(coll(c)).map(([id, d]) => ({ id, ...d })); },
    watch(c, f, op, v, fn){ const w = { col: c, run: () => fn(Object.entries(coll(c)).filter(([, d]) => match(d, f, op, v)).map(([id, d]) => ({ id, ...d }))) }; watchers.push(w); w.run(); return () => { const i = watchers.indexOf(w); if (i > -1) watchers.splice(i, 1); }; },
    async upload(file){ if (file.size > 25 * 1024 * 1024) throw new Error("الملف أكبر من 25 ميجا"); return await IDB.put(file); }
  };
  // seed sample servants so search works in the demo
  if (!data._seeded){
    const S1 = [
      ["مينا عادل", ["word"], "شبرا - القاهرة", "كنيسة مارجرجس"],
      ["مريم سمير", ["praise", "piano"], "المعادي", "كنيسة العذراء"],
      ["بيشوي نبيل", ["oud", "praise"], "أسيوط", "كنيسة الأنبا أبرام"],
      ["كيرلس فادي", ["drums"], "الإسكندرية - سيدي بشر", "كنيسة الملاك"],
      ["مارينا جرجس", ["word", "mizmar"], "المنيا", "كنيسة الإنجيلية الأولى"]
    ];
    S1.forEach(([n, t, a, ch], i) => coll("users")["demo" + i] = { name: n, nameN: norm(n), talents: t, custom: [], address: a, church: ch, phone: "0120000000" + i, bio: "", photo: "", createdAt: Date.now() - i * 1000 });
    coll("books")["demob1"] = { ownerId: "demo0", ownerName: "مينا عادل", title: "كيف تعد عظة؟ (مثال تجريبي)", titleN: norm("كيف تعد عظة"), author: "مثال", category: "خدمة وقيادة", desc: "ده كتاب تجريبي عشان تشوف شكل المكتبة.", files: [], cover: "", createdAt: Date.now() };
    data._seeded = 1; save();

}

function makeFirebase(){
  firebase.initializeApp(CFG.firebase);
  const auth = firebase.auth(), db = firebase.firestore();
  try { db.enablePersistence({ synchronizeTabs: true }).catch(() => {}); } catch (e) {}
  const map = s => s.docs.map(d => ({ id: d.id, ...d.data() }));
  const mail = p => p.includes("@") ? p : p + "@soc-app.com";
  const api = {
    uid: null, phone: null,
    auth: {
      onChange(f){ auth.onAuthStateChanged(u => { api.uid = u ? u.uid : null; api.phone = u ? ((u.email || "").endsWith("@soc-app.com") ? u.email.split("@")[0] : (u.email || "").toLowerCase()) : null; f(api.uid); }); },
      async signUp(p, pass){ const r = await auth.createUserWithEmailAndPassword(mail(p), pass); return r.user.uid; },
      async signIn(p, pass){ const r = await auth.signInWithEmailAndPassword(mail(p), pass); return r.user.uid; },
      signOut(){ return auth.signOut(); },
      async deleteMe(pass){ const u = auth.currentUser; const cred = firebase.auth.EmailAuthProvider.credential(u.email, pass); await u.reauthenticateWithCredential(cred); await u.delete(); }
    },
    async get(c, id){ const d = await db.collection(c).doc(id).get(); return d.exists ? { id: d.id, ...d.data() } : null; },
    set(c, id, o){ return db.collection(c).doc(id).set(o, { merge: true }); },
    async add(c, o){ const r = await db.collection(c).add(o); return r.id; },
    del(c, id){ return db.collection(c).doc(id).delete(); },
    async where(c, f, op, v){ return map(await db.collection(c).where(f, op, v).get()); },
    async all(c){ return map(await db.collection(c).get()); },
    watch(c, f, op, v, fn){ return db.collection(c).where(f, op, v).onSnapshot(s => fn(map(s)), e => console.warn(e)); },
    async upload(file){
      const cl = CFG.cloudinary || {};
      if (!cl.cloudName || !cl.uploadPreset) throw new Error("لازم تحط بيانات Cloudinary في ملف config.js");
      const isImg = file.type.startsWith("image/");
      const fd = new FormData(); fd.append("file", file); fd.append("upload_preset", cl.uploadPreset);
      const r = await fetch(`https://api.cloudinary.com/v1_1/${cl.cloudName}/${isImg ? "image" : "raw"}/upload`, { method: "POST", body: fd });
      const j = await r.json(); if (!r.ok) throw new Error((j.error && j.error.message) || "فشل الرفع");
      return j.secure_url;
    }
  };
  return api;
}

function authErr(e){
  const c = e && e.code || "";
  if (c.includes("email-already-in-use")) return "الرقم ده متسجل قبل كده، اعمل تسجيل دخول";
  if (c.includes("user-not-found") || c.includes("invalid-credential") || c.includes("invalid-login")) return "رقم التليفون أو كلمة السر غلط";
  if (c.includes("wrong-password")) return "كلمة السر غلط";
  if (c.includes("weak-password")) return "كلمة السر لازم 6 حروف أو أرقام على الأقل";
  if (c.includes("network")) return "مفيش إنترنت";
  if (c.includes("too-many")) return "محاولات كتير، استنى شوية وجرب تاني";
  return (e && e.message) || "حصل خطأ";
}

/* ================= تنبيهات الخدمات ================= */
const REM_OPTS = [[0, "بدون تنبيه"], [30, "قبلها بنص ساعة"], [60, "قبلها بساعة"], [180, "قبلها بـ 3 ساعات"], [720, "قبلها بـ 12 ساعة"], [1440, "قبلها بيوم"], [2880, "قبلها بيومين"], [10080, "قبلها بأسبوع"], [-1, "أحدد أنا الميعاد…"]];
const svcStart = s => new Date(`${s.date}T${s.time || "00:00"}`);
function remindTime(s){
  if (s.remindAt) return new Date(s.remindAt);
  const m = s.remindMin === undefined ? 1440 : +s.remindMin; if (!m) return null;
  return new Date(svcStart(s).getTime() - m * 60000);
}
function remindLabel(s){
  if (s.remindAt){ const d = new Date(s.remindAt); return `تنبيه يوم ${fmtDate(ymd(d))} ${fmtTime(pad(d.getHours()) + ":" + pad(d.getMinutes()))}`; }
  const m = s.remindMin === undefined ? 1440 : +s.remindMin; const o = REM_OPTS.find(x => x[0] === m);
  return m ? "تنبيه " + (o ? o[1] : `قبلها بـ ${m} دقيقة`) : "";
}
const isNative = () => !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
const LN = () => isNative() && window.Capacitor.Plugins && window.Capacitor.Plugins.LocalNotifications;
const notifId = id => { let x = 7; for (const c of String(id)) x = (x * 31 + c.charCodeAt(0)) | 0; return Math.abs(x) % 2000000000 + 1; };
let lnReady = false;
async function setupNotifications(){
  const L = LN(); if (!L || lnReady) return !!L; lnReady = true;
  try {
    let p = await L.checkPermissions(); if (p.display !== "granted") p = await L.requestPermissions();
    try { await L.createChannel({ id: "services", name: "تنبيهات الخدمات", importance: 5, sound: "default", vibration: true, visibility: 1 }); } catch (e) {}
    L.addListener("localNotificationActionPerformed", a => { const k = a && a.notification && a.notification.extra && a.notification.extra.kind; if (k === "khalwa"){ kTab = "read"; go("khalwa"); } else if (k === "day") go("churchmsgs"); else go("services"); });
  } catch (e) {}
  return true;
}
async function syncReminders(){
  if (!B.uid) return;
  try {
    const list = await B.where("services", "ownerId", "==", B.uid);
    const L = LN();
    if (L){
      await setupNotifications();
      const pend = await L.getPending();
      const old = (pend.notifications || []).filter(n => n.extra && n.extra.kind === "svc");
      if (old.length) await L.cancel({ notifications: old.map(n => ({ id: n.id })) });
      const now = Date.now();
      const items = list.map(s => ({ s, t: remindTime(s) })).filter(x => x.t && x.t.getTime() > now + 5000 && svcStart(x.s).getTime() > now);
      if (items.length) await L.schedule({ notifications: items.map(({ s, t }) => ({
        id: notifId(s.id), channelId: "services", title: "⏰ تذكير بخدمة: " + (s.title || s.meeting || "خدمة"),
        body: `${fmtDate(s.date)} الساعة ${fmtTime(s.time)}\n${s.church || ""}${s.meeting ? " • " + s.meeting : ""}${s.place ? " — " + s.place : ""}`,
        largeBody: `${fmtDate(s.date)} الساعة ${fmtTime(s.time)}\n${s.church || ""}${s.meeting ? " • " + s.meeting : ""}${s.place ? "\n" + s.place : ""}`,
        schedule: { at: t, allowWhileIdle: true }, extra: { kind: "svc", sid: s.id }
      })) });
    }
    return list;
  } catch (e){ console.warn("reminders", e); }
}
// تنبيه جوه البرنامج (للنسخة الويب أو لو التنبيه فات)
function dueReminders(list){
  const now = Date.now();
  return (list || []).filter(s => { const t = remindTime(s); return t && t.getTime() <= now && svcStart(s).getTime() > now; }).sort((a, b) => svcStart(a) - svcStart(b));
}

  const list = (byDay[calSel] || []).sort((a, b) => a.time.localeCompare(b.time));

const ext = n => (String(n).split(".").pop() || "").toLowerCase();
const fileIcon = n => { const e = ext(n); return ["ppt","pptx"].includes(e) ? "bar_chart" : ["xls","xlsx","csv"].includes(e) ? "card_file_box" : e === "pdf" ? "page_facing_up" : ["doc","docx"].includes(e) ? "memo" : ["jpg","jpeg","png","gif","webp"].includes(e) ? "framed_picture" : "file_folder"; };
const fileRow = (f, del) => `<div class="file" ${del === undefined ? `onclick="openFile('${h(f.url)}',${f.img ? 1 : 0})"` : ""}>${I(f.img ? "framed_picture" : fileIcon(f.name))}<span class="n">${h(f.name)}</span>${del !== undefined ? `<span class="x" style="color:var(--red);font-weight:800;cursor:pointer" data-rm="${del}">✕</span>` : I("outbox_tray", "sm")}</div>`;

async function uploadMany(files, statusEl){
  const out = [];
  for (let i = 0; i < files.length; i++){
    let f = files[i]; const img = f.type.startsWith("image/");
    if (statusEl) statusEl.innerHTML = `<span class="spin"></span> بيرفع ${i + 1} من ${files.length}: ${h(f.name)}`;
    if (img) f = await compressImage(f);
    const url = await B.upload(f);
    out.push({ url, name: files[i].name, img });
  }
  if (statusEl) statusEl.innerHTML = "";
  return out;
}

function streakOf(devs){
  const days = new Set(devs.map(d => d.date)); let s = 0; const d = new Date();
  if (!days.has(ymd(d))) d.setDate(d.getDate() - 1);
  while (days.has(ymd(d))){ s++; d.setDate(d.getDate() - 1); }
  return s;
}

let DAILY = null, DEVS = null, popupBusy = false, lastPopupCheck = 0, khalwaShownThisOpen = false;
async function loadDaily(){ if (DAILY) return DAILY; try { DAILY = await (await fetch("daily.json")).json(); } catch (e){ DAILY = []; } return DAILY; }
const dayNum = (d = new Date()) => Math.floor(new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime() / 86400000);
async function todayVerse(){ const l = await loadDaily(); return l.length ? l[dayNum() % l.length] : null; }
async function loadDevs(force){ if (DEVS && !force) return DEVS; DEVS = await B.where("devotions", "ownerId", "==", B.uid); return DEVS; }
const lsGet = k => { try { return localStorage.getItem(k); } catch (e){ return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const toMin = t => { if (!t) return null; const [a, b] = t.split(":").map(Number); return a * 60 + b; };
const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };

function khalwaStats(devs){
  const days = new Set(devs.map(d => d.date)), today = ymd(new Date());
  const doneToday = days.has(today);
  // البداية: يوم إنشاء الحساب (أو أول خلوة لو أقدم)
  let start = ME && ME.createdAt ? new Date(ME.createdAt) : new Date();
  devs.forEach(d => { const x = new Date(d.date + "T00:00"); if (x < start) start = x; });
  start = new Date(start.getFullYear(), start.getMonth(), start.getDate());
  let missed = 0, sinceLast = 0; const d = new Date(); d.setDate(d.getDate() - 1);
  let counting = true;
  while (d >= start){ if (!days.has(ymd(d))){ missed++; if (counting) sinceLast++; } else counting = false; d.setDate(d.getDate() - 1); }
  return { doneToday, streak: streakOf(devs), missed, sinceLast, total: devs.length };
}
function khalwaWindowText(){ const f = ME && ME.khalwaFrom, t = ME && ME.khalwaTo; return f ? `من ${fmtTime(f)}${t ? " لـ " + fmtTime(t) : ""}` : ""; }

async function checkPopups(force){
  if (!B.uid || !ME || !ME.name || popupBusy || $("#ov")) return;

  popupBusy = true;

    const today = ymd(new Date());

    const from = toMin(ME.khalwaFrom), to = toMin(ME.khalwaTo), nm = nowMin();
    const khalwaDue = !khalwaShownThisOpen && !st.doneToday && (from === null || nm >= from);

    const parts = [];
    if (firstToday) parts.push(await todayVerseCard());

      <div class="row">${I("candle", "lg")}<div class="grow"><b style="font-size:17px">${khalwaLate ? "عدّى وقت خلوتك ولسه ماخدتهاش" : "خلوتك النهارده لسه ماخدتهاش"}</b>

      <button class="btn block navy" id="goKh">${I("candle", "sm")} هاخد الخلوة دلوقتي</button></div>`);
    else if (firstToday && !st.doneToday && from !== null) parts.push(`<div class="card">${I("alarm_clock", "sm")} ميعاد خلوتك النهارده ${khalwaWindowText()}</div>`);
    if (parts.length){
      lsSet("soc_today_" + B.uid, today); khalwaShownThisOpen = true;
      modal(`<h2>${I("dove")} سلام ونعمة يا ${h((ME.name || "").split(" ")[0])}</h2>${parts.join("")}<button class="btn block ghost" id="todayOk">تمام</button>`);

// تنبيه يومي على الموبايل بميعاد الخلوة
async function syncKhalwaNotifs(){
  const L = LN(); if (!L || !B.uid) return;
  try {
    await setupNotifications();
    try { await L.createChannel({ id: "khalwa", name: "تذكير الخلوة", importance: 5, sound: "default", vibration: true, visibility: 1 }); } catch (e) {}
    const pend = await L.getPending();
    const old = (pend.notifications || []).filter(n => n.extra && n.extra.kind === "khalwa");
    if (old.length) await L.cancel({ notifications: old.map(n => ({ id: n.id })) });
    if (!ME.khalwaFrom) return;
    const devs = await loadDevs(); const done = new Set(devs.map(d => d.date));
    const [fh, fm] = ME.khalwaFrom.split(":").map(Number);
    const list = []; const now = Date.now();
    for (let i = 0; i < 10; i++){
      const d = new Date(); d.setDate(d.getDate() + i); d.setHours(fh, fm, 0, 0);
      if (d.getTime() <= now + 5000 || done.has(ymd(d))) continue;
      list.push({ id: 900000 + i, channelId: "khalwa", title: "🕯️ ميعاد خلوتك", body: "وقت خلوتك مع الرب " + khalwaWindowText() + ". اقعد مع الكلمة شوية 🙏", schedule: { at: d, allowWhileIdle: true }, extra: { kind: "khalwa" } });
    }
    if (ME.khalwaTo){
      const [th, tm] = ME.khalwaTo.split(":").map(Number); const d = new Date(); d.setHours(th, tm, 0, 0);
      if (d.getTime() > now + 5000 && !done.has(ymd(d))) list.push({ id: 900050, channelId: "khalwa", title: "🕯️ لسه ماخدتش خلوتك النهارده", body: "الوقت قرب يخلص، افتح خلوتي واقرأ ولو أصحاح واحد 🙏", schedule: { at: d, allowWhileIdle: true }, extra: { kind: "khalwa" } });
    }
    if (list.length) await L.schedule({ notifications: list });
  } catch (e){ console.warn("khalwa notif", e); }
}

const isPastor = () => ME && ME.role === "pastor" && ME.churchId;
let MYCH = null, MYSERV = [], CMS = [], cmUnsub = null;
const mapsUrl = q => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q);

async function createChurch(name, address){
  const id = await B.add("churches", { name, nameN: norm(name), address, pastorId: B.uid, pastorName: ME ? ME.name : (window.__newName || ""), sectors: DEFAULT_SECTORS.slice(), leaders: {}, createdAt: Date.now() });
  return id;
}
function becomePastorModal(){
  modal(`<h2>${I("church")} أنا قسيس / راعي كنيسة</h2>
    <label>اسم الكنيسة اللي برعاها</label><input id="cN" placeholder="مثال: كنيسة مارمرقس بشبرا">
    <label>عنوان الكنيسة</label><input id="cA" placeholder="المدينة - المنطقة - الشارع">
    <button class="btn block navy" id="cGo">${I("check_mark_button", "sm")} تسجيل الكنيسة</button>`);
  $("#cGo").onclick = async () => {
    const n = $("#cN").value.trim(), a = $("#cA").value.trim(); if (!n || !a) return toast("اكتب اسم الكنيسة وعنوانها");
    busy($("#cGo"), true);
    const cid = await createChurch(n, a);
    await B.set("users", B.uid, { role: "pastor", churchId: cid, church: n }); Object.assign(ME, { role: "pastor", churchId: cid, church: n });
    closeModal(); toast("تم تسجيل كنيستك ✓"); go("mychurch");
  };
}

async function pageChurches(){
  shell("الكنائس", `<input id="chq" placeholder="ابحث باسم الكنيسة أو المنطقة..." style="margin-bottom:12px">
    ${isPastor() ? "" : `<button class="btn block ghost" style="margin:0 0 12px" onclick="becomePastorModal()">${I("church", "sm")} إنت قسيس؟ سجّل كنيستك</button>`}
    <div id="chl"><div class="empty"><span class="spin"></span></div></div>`);
  const all = (await B.all("churches")).filter(c => !c.deleted).sort((a, b) => (a.name || "").localeCompare(b.name || "", "ar"));
  const draw = () => {
    const q = norm($("#chq").value);
    const l = all.filter(c => !q || norm(`${c.name} ${c.address} ${c.pastorName}`).includes(q));
    $("#chl").innerHTML = `<div class="muted" style="margin-bottom:8px">${l.length} كنيسة</div>` + (l.map(c => `<div class="card">
      <div class="row">${I("church", "lg")}<div class="grow"><b style="font-size:16px">${h(c.name)}</b>
      <div class="muted">${I("round_pushpin", "sm")} ${h(c.address)}</div>
      <div class="muted">${I("bust_in_silhouette", "sm")} الراعي: ${h(c.pastorName || "")}</div></div></div>
      <div class="row" style="margin-top:8px"><a class="btn sm ghost grow" href="${mapsUrl(c.name + " " + c.address)}" target="_blank" rel="noopener" onclick="if(isNative()){openExt(this.href);return false}">${I("round_pushpin", "sm")} الخريطة</a>
      ${c.pastorId !== B.uid ? `<button class="btn sm navy grow" onclick="go('user/${c.pastorId}')">${I("bust_in_silhouette", "sm")} الراعي</button><button class="btn sm grow" onclick="openChatWith('${c.pastorId}')">${I("speech_balloon", "sm")} مراسلة</button>` : `<button class="btn sm navy grow" onclick="go('mychurch')">${I("busts_in_silhouette", "sm")} خدام كنيستي</button>`}</div></div>`).join("")
      || `<div class="empty">${I("church", "xl")}<p>لسه مفيش كنايس متسجلة</p></div>`);
  };
  $("#chq").oninput = draw; draw();
}

async function loadMyChurch(){
  MYCH = await B.get("churches", ME.churchId);
  MYSERV = await B.where("churchServants", "pastorId", "==", B.uid);
  MYSERV = MYSERV.filter(s => s.churchId === ME.churchId);
  return MYCH;
}
async function pageMyChurch(){
  if (!isPastor()){ shell("خدام كنيستي", `<div class="empty">${I("church", "xl")}<p>الصفحة دي لراعي الكنيسة</p><button class="btn navy" onclick="becomePastorModal()">سجّل كنيستك</button></div>`); return; }
  shell("خدام كنيستي", `<div class="empty"><span class="spin"></span></div>`);
  const ch = await loadMyChurch(); if (!ch){ $("#pg").innerHTML = '<div class="empty">الكنيسة مش موجودة</div>' + footer(); return; }
  const secs = ch.sectors || [];
  const count = s => MYSERV.filter(x => x.sector === s).length;
  const leaderOf = s => { const id = (ch.leaders || {})[s]; return MYSERV.find(x => x.id === id); };
  $("#pg").innerHTML = `
    <div class="hero">${I("church", "lg")}<div class="grow"><h2>${h(ch.name)}</h2><div class="muted">${h(ch.address)}</div></div>
      <button class="btn sm ghost" onclick="editChurchModal()">${I("pencil", "sm")}</button></div>
    <div class="row wrap2" style="margin-bottom:12px">
      <button class="btn navy grow" onclick="churchMsgModal('all')">${I("megaphone", "sm")} رسالة لكل الخدام (${MYSERV.length})</button>
      <button class="btn grow" onclick="spiritualDayModal()">${I("candle", "sm")} يوم روحي</button></div>
    <h3>${I("busts_in_silhouette", "sm")} قطاعات الخدمة</h3>
    ${secs.map((s, i) => { const L = leaderOf(s); return `<div class="item" onclick="go('sector/${i}')">${I("clipboard", "lg")}<div class="grow"><div class="t">${h(s)}</div>
      <div class="muted">${count(s)} خادم${L ? ` • القائد العام: ${h(L.name)}` : ""}</div></div><span class="muted">←</span></div>`; }).join("")}
    <button class="btn block ghost" onclick="addSectorModal()">${I("plus", "sm")} إضافة قطاع خدمة جديد</button>
    <h3 style="margin-top:18px">${I("scroll", "sm")} الرسائل والأيام الروحية اللي اتبعتت</h3><div id="sent"></div>${footer()}`;
  hydrate($("#pg"));
  const sent = (await B.where("churchMsgs", "pastorId", "==", B.uid)).sort((a, b) => b.at - a.at).slice(0, 20);
  $("#sent").innerHTML = sent.map(m => `<div class="card"><div class="row"><b class="grow">${I(m.type === "day" ? "candle" : "megaphone", "sm")} ${h(m.title || (m.type === "day" ? "يوم روحي" : "رسالة"))}</b><span class="muted">${ago(m.at)}</span></div>
    <div class="muted">لـ ${m.scope === "all" ? "كل الخدام" : h(m.scope)} • وصلت لـ ${(m.targetUids || []).length} على البرنامج</div>
    ${m.type === "day" && m.event ? `<div class="muted">${I("spiral_calendar", "sm")} ${fmtDate(m.event.date)} ${fmtTime(m.event.time)}${m.event.place ? " — " + h(m.event.place) : ""}</div>` : ""}
    ${m.text ? `<div style="white-space:pre-wrap;margin-top:6px">${h(m.text)}</div>` : ""}
    <button class="btn sm red" style="margin-top:6px" onclick="delCM('${m.id}')">${I("wastebasket", "sm")} حذف</button></div>`).join("") || '<div class="muted">لسه مبعتش رسايل</div>';
}
function editChurchModal(){
  modal(`<h2>${I("church")} بيانات الكنيسة</h2><label>اسم الكنيسة</label><input id="cN" value="${h(MYCH.name)}"><label>العنوان</label><input id="cA" value="${h(MYCH.address)}"><button class="btn block navy" id="cGo">حفظ</button>`);
  $("#cGo").onclick = async () => { const n = $("#cN").value.trim(), a = $("#cA").value.trim(); if (!n || !a) return toast("اكتب الاسم والعنوان"); await B.set("churches", MYCH.id, { name: n, nameN: norm(n), address: a, pastorName: ME.name }); await B.set("users", B.uid, { church: n }); ME.church = n; closeModal(); toast("تم الحفظ ✓"); pageMyChurch(); };
}
function addSectorModal(){
  modal(`<h2>${I("plus")} قطاع خدمة جديد</h2><label>اسم القطاع</label><input id="sN" placeholder="مثال: اجتماع السيدات"><button class="btn block navy" id="sGo">إضافة</button>`);
  $("#sGo").onclick = async () => { const n = $("#sN").value.trim(); if (!n) return toast("اكتب اسم القطاع"); const secs = [...(MYCH.sectors || [])]; if (secs.includes(n)) return toast("القطاع موجود"); secs.push(n); await B.set("churches", MYCH.id, { sectors: secs }); closeModal(); toast("تم ✓"); pageMyChurch(); };
}
async function pageSector(i){
  if (!isPastor()) return go("home");
  shell("قطاع خدمة", `<div class="empty"><span class="spin"></span></div>`);
  await loadMyChurch(); const s = (MYCH.sectors || [])[+i]; if (!s){ go("mychurch"); return; }
  const list = MYSERV.filter(x => x.sector === s).sort((a, b) => a.name.localeCompare(b.name, "ar"));
  const lid = (MYCH.leaders || {})[s], L = list.find(x => x.id === lid);
  $("#pg").innerHTML = `<h2 style="margin:0 0 10px">${I("clipboard")} ${h(s)}</h2>
    <div class="card" style="background:linear-gradient(135deg,#fff8e1,#fff)">${I("crown")} <b>القائد العام:</b> ${L ? `${h(L.name)} <span class="muted" dir="ltr">${h(L.phone)}</span>` : '<span class="muted">لسه متحددش — اضغط على أي خادم واختاره قائد</span>'}</div>
    <div class="row wrap2" style="margin-bottom:12px"><button class="btn navy grow" onclick="addServantModal(${+i})">${I("plus", "sm")} إضافة خادم</button>
      <button class="btn grow" onclick="churchMsgModal(${+i})">${I("megaphone", "sm")} رسالة لكل القطاع (${list.length})</button></div>
    ${list.map(x => `<div class="item" onclick="servantModal('${x.id}',${+i})">${I(x.id === lid ? "crown" : "bust_in_silhouette", "lg")}<div class="grow"><div class="t">${h(x.name)}${x.id === lid ? ' <span class="tag">القائد العام</span>' : ""}</div>
      <div class="muted" dir="ltr" style="text-align:right">${h(x.phone)}</div>${x.uid ? '<span class="tag" style="background:#e3f5ec;color:var(--green)">على البرنامج ✓</span>' : '<span class="tag">مش على البرنامج (واتساب)</span>'}</div></div>`).join("")
      || `<div class="empty">${I("busts_in_silhouette", "xl")}<p>لسه مفيش خدام في القطاع ده</p></div>`}
    ${list.length ? "" : `<button class="btn block ghost" style="color:var(--red)" onclick="delSector(${+i})">${I("wastebasket", "sm")} حذف القطاع</button>`}${footer()}`;
  hydrate($("#pg"));
}
async function findUserByPhone(ph){
  const d = digits(ph); if (d.length < 8) return null;
  try { const l = await B.where("users", "phone", "==", d); return l.find(u => !u.blocked && !u.deleted) || null; } catch (e){ return null; }
}
function addServantModal(i){
  const s = MYCH.sectors[i];
  modal(`<h2>${I("plus")} إضافة خادم لـ ${h(s)}</h2>
    <label>اسم الخادم</label><input id="vN"><label>رقم التليفون</label><input id="vP" type="tel" dir="ltr" placeholder="01xxxxxxxxx">
    <p class="muted">لو الخادم متسجل على البرنامج بنفس الرقم، الرسايل هتوصله جوه البرنامج. لو مش متسجل هتقدر تبعتله واتساب.</p>
    <button class="btn block navy" id="vGo">إضافة</button>`);
  $("#vGo").onclick = async () => {
    const n = $("#vN").value.trim(), p = digits($("#vP").value); if (!n || p.length < 8) return toast("اكتب الاسم ورقم تليفون صحيح");
    if (MYSERV.some(x => x.sector === s && x.phone === p)) return toast("الخادم ده موجود في القطاع");
    busy($("#vGo"), true);
    const u = await findUserByPhone(p);
    await B.add("churchServants", { churchId: MYCH.id, pastorId: B.uid, sector: s, name: n, phone: p, uid: u ? u.id : "", createdAt: Date.now() });
    closeModal(); toast(u ? `تم ✓ — ${u.name} على البرنامج` : "تم ✓"); pageSector(i);
  };
}
function servantModal(id, i){
  const x = MYSERV.find(v => v.id === id); if (!x) return; const s = MYCH.sectors[i]; const isL = (MYCH.leaders || {})[s] === id;
  modal(`<h2>${I("bust_in_silhouette")} ${h(x.name)}</h2><div class="muted" dir="ltr" style="text-align:right;margin-bottom:10px">${h(x.phone)}</div>
    ${x.uid ? `<button class="btn block navy" onclick="closeModal();openChatWith('${x.uid}')">${I("speech_balloon", "sm")} ابعتله رسالة في البرنامج</button>
      <button class="btn block ghost" onclick="closeModal();go('user/${x.uid}')">${I("bust_in_silhouette", "sm")} البروفايل</button>` : `<div class="muted">الخادم ده مش متسجل على البرنامج لسه.</div><button class="btn block ghost" id="relink">${I("magnifying_glass_tilted_left", "sm")} دوّر عليه تاني على البرنامج</button>`}
    <a class="btn block" style="background:#25d366;color:#fff;text-decoration:none" href="https://wa.me/${waNum(x.phone)}" target="_blank" rel="noopener" onclick="if(isNative()){openExt(this.href);return false}">${I("mobile_phone", "sm")} واتساب</a>
    <a class="btn block ghost" style="text-decoration:none" href="tel:${h(x.phone)}">${I("telephone_receiver", "sm")} اتصال</a>
    <button class="btn block ${isL ? "ghost" : ""}" id="mkL">${I("crown", "sm")} ${isL ? "إلغاء القائد العام" : "اجعله القائد العام للقطاع"}</button>
    <button class="btn block red" id="rmV">${I("wastebasket", "sm")} حذف من القطاع</button>`);
  $("#mkL").onclick = async () => { const leaders = { ...(MYCH.leaders || {}) }; if (isL) delete leaders[s]; else leaders[s] = id; await B.set("churches", MYCH.id, { leaders: null }); await B.set("churches", MYCH.id, { leaders }); closeModal(); toast("تم ✓"); pageSector(i); };
  $("#rmV").onclick = async () => { if (!(await confirmBox(`تحذف ${x.name} من ${s}؟`))) return; await B.del("churchServants", id); closeModal(); pageSector(i); };
  if ($("#relink")) $("#relink").onclick = async () => { const u = await findUserByPhone(x.phone); if (!u) return toast("لسه مش متسجل بالرقم ده"); await B.set("churchServants", id, { uid: u.id }); closeModal(); toast("تم ربطه بحسابه ✓"); pageSector(i); };
}
async function delSector(i){ const s = MYCH.sectors[i]; if (!(await confirmBox(`تحذف قطاع ${s}؟`))) return; const secs = MYCH.sectors.filter((_, k) => k !== i); await B.set("churches", MYCH.id, { sectors: secs }); go("mychurch"); }

// رسالة لكل الخدام أو لقطاع
async function relinkAll(list){
  for (const x of list) if (!x.uid){ const u = await findUserByPhone(x.phone); if (u){ x.uid = u.id; B.set("churchServants", x.id, { uid: u.id }); } }
  return list;
}
function churchMsgModal(scopeIdx, preset){
  const scope = scopeIdx === "all" ? "all" : MYCH.sectors[scopeIdx];
  let image = "";
  modal(`<h2>${I("megaphone")} رسالة ${scope === "all" ? "لكل خدام الكنيسة" : "لقطاع " + h(scope)}</h2>
    <label>العنوان</label><input id="mT" placeholder="مثال: اجتماع خدام مهم">
    <label>الرسالة</label><textarea id="mX"></textarea>
    <label>صورة (اختياري)</label><div id="mImg"></div><button class="btn sm ghost" id="mImgB">${I("camera", "sm")} اختار صورة</button><input type="file" id="mImgF" accept="image/*" hidden>
    <div id="mSt" class="muted"></div>
    <button class="btn block navy" id="mGo">${I("outbox_tray", "sm")} إرسال</button>`);
  const drawI = () => { $("#mImg").innerHTML = image ? `<img data-f="${h(image)}" style="width:100%;border-radius:12px">` : ""; hydrate($("#mImg")); };
  $("#mImgB").onclick = () => $("#mImgF").click();
  $("#mImgF").onchange = async e => { try { const [f] = await uploadMany([e.target.files[0]], $("#mSt")); image = f.url; drawI(); } catch (er){ toast(er.message || "فشل الرفع"); } };
  $("#mGo").onclick = async () => {
    const title = $("#mT").value.trim(), text = $("#mX").value.trim(); if (!text && !image) return toast("اكتب الرسالة");
    busy($("#mGo"), true);
    await sendChurchMsg({ type: "msg", scope, title, text, image });
  };
}
function spiritualDayModal(){
  modal(`<h2>${I("candle")} يوم روحي</h2><p class="muted">هيوصل لكل خدام كنيستك، ويظهر في التقويم بتاعهم، ويجيلهم تنبيه قبلها بيوم.</p>
    <label>اسم اليوم الروحي</label><input id="dT" placeholder="مثال: يوم صلاة وصوم للخدام">
    <div class="row"><div class="grow"><label>التاريخ</label><input id="dD" type="date" value="${ymd(new Date())}"></div><div class="grow"><label>الوقت</label><input id="dH" type="time" value="10:00"></div></div>
    <label>المكان</label><input id="dP" value="${h(MYCH ? MYCH.name : "")}">
    <label>تفاصيل</label><textarea id="dX" style="min-height:70px"></textarea>
    <label>يوصل لمين؟</label><select id="dS"><option value="all">كل خدام الكنيسة</option>${(MYCH.sectors || []).map((s, i) => `<option value="${i}">${h(s)}</option>`).join("")}</select>
    <button class="btn block navy" id="dGo">${I("outbox_tray", "sm")} إرسال</button>`);
  $("#dGo").onclick = async () => {
    const title = $("#dT").value.trim(), date = $("#dD").value; if (!title || !date) return toast("اكتب الاسم والتاريخ");
    const sv = $("#dS").value; busy($("#dGo"), true);
    await sendChurchMsg({ type: "day", scope: sv === "all" ? "all" : MYCH.sectors[+sv], title, text: $("#dX").value.trim(), image: "", event: { date, time: $("#dH").value, place: $("#dP").value.trim() } });
  };
}
async function sendChurchMsg(o){
  const list = await relinkAll(MYSERV.filter(x => o.scope === "all" || x.sector === o.scope));
  const targetUids = [...new Set(list.filter(x => x.uid && x.uid !== B.uid).map(x => x.uid))];
  await B.add("churchMsgs", { ...o, churchId: MYCH.id, churchName: MYCH.name, pastorId: B.uid, pastorName: ME.name, targetUids, at: Date.now() });
  const off = list.filter(x => !x.uid);
  const wtext = `${o.type === "day" ? "🕯️ " : "📣 "}${o.title ? o.title + "\n" : ""}${o.text || ""}${o.event ? `\n📅 ${fmtDate(o.event.date)} ${fmtTime(o.event.time)}${o.event.place ? "\n📍 " + o.event.place : ""}` : ""}\n— ${MYCH.name}`;
  closeModal();
  toast(`وصلت لـ ${targetUids.length} خادم على البرنامج ✓`);
  if (off.length){
    modal(`<h2>${I("mobile_phone")} خدام مش على البرنامج (${off.length})</h2><p class="muted">ابعتلهم نفس الرسالة على واتساب:</p>
      ${off.map(x => `<a class="file" style="text-decoration:none;color:inherit" href="https://wa.me/${waNum(x.phone)}?text=${encodeURIComponent(wtext)}" target="_blank" rel="noopener" onclick="if(isNative()){openExt(this.href);return false}">${I("mobile_phone")}<span class="n">${h(x.name)}</span><span class="muted" dir="ltr">${h(x.phone)}</span></a>`).join("")}
      <button class="btn block ghost" onclick="closeModal()">تمام</button>`);
  }
  if (curRoute()[0] === "mychurch") pageMyChurch(); else if (curRoute()[0] === "sector") pageSector(curRoute()[1]);
}
async function delCM(id){ if (!(await confirmBox("تحذف الرسالة دي؟"))) return; await B.del("churchMsgs", id); pageMyChurch(); }

// استقبال رسائل الكنيسة عند الخادم
function watchCM(){
  if (cmUnsub) cmUnsub();
  cmUnsub = B.watch("churchMsgs", "targetUids", "array-contains", B.uid, list => {
    CMS = list.sort((a, b) => b.at - a.at); renderNav();
    if (curRoute()[0] === "churchmsgs") pageChurchMsgs();
    const b = $("#cmBadge"); if (b) b.textContent = unseenCM().length || "";
    syncDayNotifs();
    setTimeout(() => checkPopups(), 900);
  });
}
const unseenCM = () => { const seen = (ME && ME.cmSeen) || []; return CMS.filter(m => !seen.includes(m.id)); };
async function markCMSeen(ids){ if (!ME || !ids.length) return; ME.cmSeen = [...new Set([...(ME.cmSeen || []), ...ids])].slice(-300); try { await B.set("users", B.uid, { cmSeen: ME.cmSeen }); } catch (e) {} const b = $("#cmBadge"); if (b) b.textContent = unseenCM().length || ""; }
function cmCard(m){
  return `<div class="card" style="border:1.5px solid ${m.type === "day" ? "var(--gold)" : "var(--line)"}">
    <div class="row">${I(m.type === "day" ? "candle" : "church")}<div class="grow"><b>${h(m.title || (m.type === "day" ? "يوم روحي" : "رسالة من الكنيسة"))}</b><div class="muted">${h(m.churchName)} • ${h(m.pastorName || "")} • ${ago(m.at)}</div></div></div>
    ${m.image ? `<img data-f="${h(m.image)}" onclick="openFile('${h(m.image)}',1)" style="width:100%;border-radius:14px;margin-top:8px;cursor:pointer;max-height:380px;object-fit:cover">` : ""}
    ${m.text ? `<div style="white-space:pre-wrap;line-height:1.8;margin-top:8px">${h(m.text)}</div>` : ""}
    ${m.type === "day" && m.event ? `<div style="background:#fff8e1;border-radius:12px;padding:10px;margin-top:8px"><div>${I("spiral_calendar", "sm")} ${fmtDate(m.event.date)} — ${fmtTime(m.event.time)}</div>${m.event.place ? `<div>${I("round_pushpin", "sm")} ${h(m.event.place)}</div>` : ""}</div>` : ""}
    <button class="btn sm ghost" style="margin-top:8px" onclick="closeModal();openChatWith('${m.pastorId}')">${I("speech_balloon", "sm")} رد على الراعي</button></div>`;
}
function showCMPopup(){
  const l = unseenCM(); if (!l.length) return;
  modal(`<h2>${I("church")} رسالة من كنيستك</h2><div id="cmPop">${l.map(cmCard).join("")}</div><button class="btn block navy" id="cmOk">تمام</button>`);

async function syncDayNotifs(){
  const L = LN(); if (!L) return;
  try {
    await setupNotifications();
    const pend = await L.getPending();
    const old = (pend.notifications || []).filter(n => n.extra && n.extra.kind === "day");
    if (old.length) await L.cancel({ notifications: old.map(n => ({ id: n.id })) });
    const now = Date.now();
    const items = CMS.filter(m => m.type === "day" && m.event && m.event.date).map(m => { const t = new Date(`${m.event.date}T${m.event.time || "09:00"}`); t.setDate(t.getDate() - 1); return { m, t }; }).filter(x => x.t.getTime() > now + 5000);
    if (items.length) await L.schedule({ notifications: items.map(({ m, t }) => ({ id: notifId("day" + m.id), channelId: "services", title: "🕯️ بكرة: " + (m.title || "يوم روحي"), body: `${fmtDate(m.event.date)} ${fmtTime(m.event.time)} — ${m.event.place || m.churchName}`, schedule: { at: t, allowWhileIdle: true }, extra: { kind: "day" } })) });
  } catch (e) {}
}
