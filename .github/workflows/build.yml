name: Build APK + Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install
        run: npm install
      - name: Add Android platform
        run: npx cap add android
      - name: App icon
        run: npx capacitor-assets generate --android --iconBackgroundColor '#14213d' --splashBackgroundColor '#14213d' || true
      - name: Notification icon + permissions
        run: |
          mkdir -p android/app/src/main/res/drawable
          cp assets/ic_stat_soc.png android/app/src/main/res/drawable/ic_stat_soc.png
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n</manifest>#' $M
          grep -n "permission" $M
      - name: Sync
        run: npx cap sync android
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../SOC.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SOC-apk
          path: SOC.apk
      - name: Publish release (رابط تحميل مباشر)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: جنود المسيح - نسخة ${{ github.run_number }}
          files: SOC.apk

  website:
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - uses: actions/deploy-pages@v4
